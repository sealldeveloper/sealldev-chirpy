name: Jekyll CI/CD

on:
  push:
    branches:
      - master  # or your default branch name
  pull_request:
    branches:
      - master  # or your default branch name
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3.5'  # or the version you're using
        bundler-cache: true
        cache-version: 0

    - name: Install dependencies
      run: |
        gem install bundler
        bundle install

    - name: Build Jekyll site
      run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
      env:
        JEKYLL_ENV: production
    
    - name: Generate hash of build
      run: |
        find _site -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum > build_hash.txt
        echo "BUILD_HASH=$(cat build_hash.txt)" >> $GITHUB_ENV
    
    - name: Check if build has changed
      id: check_build
      run: |
        if curl -s -f -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}/actions/artifacts" | \
          jq -e '.artifacts[] | select(.name=="github-pages") | .id' > /dev/null; then
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts" | \
            jq -r '.artifacts[] | select(.name=="github-pages") | .archive_download_url' | \
            xargs curl -s -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o previous_artifact.zip
          unzip -q previous_artifact.zip -d previous_build
          find previous_build -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum > previous_hash.txt
          if cmp -s build_hash.txt previous_hash.txt; then
            echo "BUILD_CHANGED=false" >> $GITHUB_ENV
          else
            echo "BUILD_CHANGED=true" >> $GITHUB_ENV
          fi
        else
          echo "BUILD_CHANGED=true" >> $GITHUB_ENV
        fi

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3

    - name: Set build status
      run: echo "BUILD_STATUS=success" >> $GITHUB_ENV

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  pr_check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check build status
        run: |
          if [[ "${{ needs.build.result }}" == "success" ]]; then
            echo "Build succeeded"
            exit 0
          else
            echo "Build failed"
            exit 1
          fi
