name: Jekyll CI/CD

on:
  push:
    branches:
      - master  # or your default branch name
  pull_request:
    branches:
      - master  # or your default branch name
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3.5'  # or the version you're using
        bundler-cache: true
        cache-version: 0

    - name: Install dependencies
      run: |
        gem install bundler
        bundle install

    - name: Build Jekyll site
      run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
      env:
        JEKYLL_ENV: production

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v4

    - name: Set build status
      run: echo "BUILD_STATUS=success" >> $GITHUB_ENV

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  pr_check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check build status
        run: |
          if [[ "${{ needs.build.result }}" == "success" ]]; then
            echo "Build succeeded"
            exit 0
          else
            echo "Build failed"
            exit 1
          fi

      - name: PR Build Status
        run: |
          if [[ "${{ needs.build.result }}" == "success" ]]; then
            echo "Pull request build completed successfully."
          else
            echo "Pull request build failed."
            exit 1
          fi
